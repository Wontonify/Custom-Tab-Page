<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
  </head>
  <body>
    <div id="app">
      <form id="search" role="search" method="get" action="https://www.google.com/search">
        <div id="engine">
          <button
            type="button"
            id="engine-toggle"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-label="Search engine"
          >
            <span id="engine-label">Google</span>
            <svg viewBox="0 0 10 6" aria-hidden="true">
              <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
          <ul id="engine-menu" role="listbox" aria-label="Search engine" hidden></ul>
        </div>
        <input
          type="search"
          name="q"
          placeholder="Search Google"
          aria-label="Search query"
          autocomplete="off"
          autofocus
        />
      </form>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
